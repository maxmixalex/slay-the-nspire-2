name: Native tests and portable builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-format-18 clang-tidy-18 lld-18 cmake ninja-build
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build/ci -G Ninja -DSPIRE_X11=OFF
          -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-O1 -fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_C_FLAGS="-O1 -fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Check native code
        run: cmake --build build/ci --target format-check tidy
      - name: Build native regressions
        run: cmake --build build/ci --parallel 2
      - name: Run all registered native suites
        # Instrumented fixtures keep multiple complete States/save snapshots.
        # This host-only allowance does not change the Ndless runtime budget.
        run: |
          ulimit -s 32768
          ctest --test-dir build/ci --output-on-failure --parallel 2

  conversion:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry environment
        run: |
          pipx install 'poetry>=2.2,<3'
          poetry install --with dev,build
      - name: Check converter, tooling and binary formats
        run: poetry run poe check

  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install portable toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y clang-18 lld-18
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
          pipx install 'poetry>=2.2,<3'
          poetry install --with build
      - name: Build calculator launcher
        run: poetry run poe ndless --compression zopfli --output dist/nSpire2.tns
      - name: Build WebAssembly runtime
        run: poetry run poe web --compile-only
      - name: Stage calculator launcher
        run: |
          out="$RUNNER_TEMP/calculator-launcher"
          mkdir -p "$out/licenses"
          install -m 644 dist/nSpire2.tns "$out/"
          install -m 644 LICENSE cpp/third_party/notices/*.txt "$out/licenses/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nspire2-launcher
          path: ${{ runner.temp }}/calculator-launcher/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
