name: Native regression and ARM build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified tag
        with:
          persist-credentials: false
      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld cmake ninja-build
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build/ci -G Ninja -DSPIRE_X11=OFF
          -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build and test without private assets
        run: |
          cmake --build build/ci --parallel 2
          ctest --test-dir build/ci --output-on-failure
      - name: Build Ndless launcher
        run: python3 tools/build_ndless.py
      - name: Check converter syntax
        run: python3 -m compileall -q tools
