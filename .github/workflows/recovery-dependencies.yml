name: Offline validation dependencies

on:
  workflow_dispatch:
  push:
    branches: ['work/ui20-integration']
    paths: ['.github/workflows/recovery-dependencies.yml']

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download pinned public test dependencies for CPython 3.13
        run: |
          python3 -m pip download --only-binary=:all: --python-version 313 --implementation cp --abi cp313 \
            --platform manylinux_2_17_x86_64 --platform manylinux2014_x86_64 \
            --dest "$RUNNER_TEMP/validation-wheels" \
            zstandard==0.25.0 zopfli==0.4.3 fonttools==4.61.1 regex==2026.9.29 unicorn==2.1.4
          cd "$RUNNER_TEMP/validation-wheels"
          sha256sum *.whl > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-wheels-${{ github.sha }}
          path: ${{ runner.temp }}/validation-wheels/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
