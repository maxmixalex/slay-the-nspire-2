name: Desktop converters

on:
  workflow_dispatch:
  push:
    branches: ['main', 'work/**', 'checkpoint/**']
    paths:
      - '.github/workflows/converters.yml'
      - 'convert.py'
      - 'tools/**'
      - 'include/**'
      - 'src/**'
      - 'platform/**'
      - 'third_party/lzma2/**'
      - 'tests/arm_division_regression.py'
      - 'tests/arm_sparse_tile_regression.py'
      - 'tests/test_converter_workspace.py'
      - 'tests/test_converter_builtin_workspace.py'
      - 'CMakeLists.txt'
      - 'docs/converter.md'
      - 'requirements*.txt'
      - 'VERSION'
      - 'config/**'

permissions:
  contents: read

concurrency:
  group: desktop-converters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and execute the exact public linked ARM validation helper
        run: |
          sudo apt-get update && sudo apt-get install -y clang-18 lld-18
          python -m pip install -r requirements.txt
          python tools/build_converter_validation.py --output "$RUNNER_TEMP/arm-validation"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: converter-arm-validation-${{ github.sha }}
          path: ${{ runner.temp }}/arm-validation/
          if-no-files-found: error
          retention-days: 30
  windows-converter:
    needs: arm-validation
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install the pinned converter build dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt -r requirements-release.txt pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Windows workspace locking and recovery
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_converter_*workspace.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the public pinned Spine source and native helpers
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'converter-dependencies'
          $helpers = Join-Path $env:RUNNER_TEMP 'converter-helpers'
          python tools/prepare_converter_dependencies.py --output $deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidates = @('C:\mingw64\bin\g++.exe', 'C:\msys64\mingw64\bin\g++.exe')
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { $compiler = (Get-Command g++.exe -ErrorAction Stop).Source }
          python tools/build_converter_helpers.py --rid win-x64 --dotnet (Get-Command dotnet).Source --cxx $compiler --spine-runtime "$deps/spine-runtime/OurNotes.Spine.Runtime.dll" --fastnoise-header "$deps/FastNoiseLite.h" --output $helpers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: converter-arm-validation-${{ github.sha }}
          path: ${{ runner.temp }}/converter-helpers/win-x64/
      - name: Execute the genuine linked ARM oracle in Windows source mode
        shell: pwsh
        run: |
          $helpers = Join-Path $env:RUNNER_TEMP 'converter-helpers/win-x64'
          $logs = Join-Path $env:RUNNER_TEMP 'converter-diagnostics'
          New-Item -ItemType Directory -Force $logs | Out-Null
          python -X utf8 -u tools/converter_arm_validation.py --helpers $helpers --output "$logs/source-arm-self-test.json" 2>&1 | Tee-Object -FilePath "$logs/source-arm-self-test.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the pinned Unicorn-compatible Windows bootloader
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'converter-bootloader'
          python tools/build_converter_bootloader.py --work $work
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and check the executable without developer runtime paths
        shell: pwsh
        run: |
          $helpers = Join-Path $env:RUNNER_TEMP 'converter-helpers/win-x64'
          $output = Join-Path $env:RUNNER_TEMP 'converter-delivery'
          $work = Join-Path $env:RUNNER_TEMP 'converter-bundle-work'
          $bootloader = Join-Path $env:RUNNER_TEMP 'converter-bootloader'
          $env:PYTHONPATH = Join-Path $bootloader 'vendor'
          python -X utf8 tools/build_converter_bundle.py --helpers $helpers --output $output --work $work
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$bootloader/bootloader-compatibility.json" "$output/bootloader-compatibility.json"
          Copy-Item docs/converter.md "$output/README.md"
          git rev-parse HEAD | Out-File -Encoding ascii "$output/COMMIT"
      - name: Preserve source and frozen native diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: converter-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/converter-diagnostics/
            ${{ runner.temp }}/converter-bundle-work/frozen-self-test*
            ${{ runner.temp }}/converter-bootloader/bootloader-build.log
            ${{ runner.temp }}/converter-bootloader/bootloader-compatibility.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload the Windows converter and dependency license notices
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nspire2-converter-windows-${{ github.sha }}
          path: ${{ runner.temp }}/converter-delivery/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  linux-converter:
    needs: arm-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the Linux helpers from pinned public sources
        run: |
          python -m pip install -r requirements.txt -r requirements-release.txt pyinstaller==6.16.0
          deps="$RUNNER_TEMP/converter-dependencies"
          python tools/prepare_converter_dependencies.py --output "$deps"
          python tools/build_converter_helpers.py --rid linux-x64 --cxx g++ \
            --spine-runtime "$deps/spine-runtime/OurNotes.Spine.Runtime.dll" \
            --fastnoise-header "$deps/FastNoiseLite.h" --output "$RUNNER_TEMP/converter-helpers"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: converter-arm-validation-${{ github.sha }}
          path: ${{ runner.temp }}/converter-helpers/linux-x64/
      - name: Build and exercise the standalone Linux converter
        run: |
          output="$RUNNER_TEMP/converter-delivery"
          python tools/build_converter_bundle.py --helpers "$RUNNER_TEMP/converter-helpers/linux-x64" \
            --output "$output" --work "$RUNNER_TEMP/converter-bundle-work"
          cp docs/converter.md "$output/README.md"
          git rev-parse HEAD > "$output/COMMIT"
      - name: Upload the Linux converter and its notices
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nspire2-converter-linux-${{ github.sha }}
          path: ${{ runner.temp }}/converter-delivery/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
