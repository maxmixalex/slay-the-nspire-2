name: Desktop converters

on:
  workflow_dispatch:
  push:
    branches: ['main', 'work/**', 'checkpoint/**', 'release/**']
    paths:
      - '.github/workflows/converters.yml'
      - 'python/**'
      - 'cpp/**'
      - 'pyproject.toml'
      - 'poetry.lock'

permissions:
  contents: read

concurrency:
  group: desktop-converters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: pipx install 'poetry>=2,<3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: poetry
      - run: poetry install --no-interaction
      - name: Build and execute the linked ARM decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          poetry run python python/tools/build_converter_validation.py --output "$RUNNER_TEMP/arm-validation"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: converter-arm-validation-${{ github.sha }}
          path: ${{ runner.temp }}/arm-validation/
          if-no-files-found: error
          retention-days: 14

  converter:
    needs: arm-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            rid: linux-x64
          - os: windows-2022
            platform: windows
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: pipx install 'poetry>=2,<3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: poetry
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: poetry install --no-interaction
      - name: Prepare public sampler sources
        run: poetry run python python/tools/prepare_converter_dependencies.py --output "${{ runner.temp }}/converter-dependencies"
      - name: Build Linux sampling helpers
        if: runner.os == 'Linux'
        run: |
          poetry run python python/tools/build_converter_helpers.py --rid linux-x64 --cxx g++ \
            --spine-runtime "$RUNNER_TEMP/converter-dependencies/spine-runtime/OurNotes.Spine.Runtime.dll" \
            --fastnoise-header "$RUNNER_TEMP/converter-dependencies/FastNoiseLite.h" \
            --output "$RUNNER_TEMP/converter-helpers"
      - name: Build Windows sampling helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'converter-dependencies'
          $helpers = Join-Path $env:RUNNER_TEMP 'converter-helpers'
          $candidates = @('C:\mingw64\bin\g++.exe', 'C:\msys64\mingw64\bin\g++.exe')
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { $compiler = (Get-Command g++.exe -ErrorAction Stop).Source }
          poetry run python python/tools/build_converter_helpers.py --rid win-x64 --dotnet (Get-Command dotnet).Source --cxx $compiler --spine-runtime "$deps/spine-runtime/OurNotes.Spine.Runtime.dll" --fastnoise-header "$deps/FastNoiseLite.h" --output $helpers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: converter-arm-validation-${{ github.sha }}
          path: ${{ runner.temp }}/converter-helpers/${{ matrix.rid }}/
      - name: Compile with Nuitka and exercise the standalone converter
        run: >-
          poetry run poe converter
          --helpers "${{ runner.temp }}/converter-helpers/${{ matrix.rid }}"
          --output "${{ runner.temp }}/converter-delivery"
          --work "${{ runner.temp }}/converter-build"
      - name: Preserve compiler diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: converter-diagnostics-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/converter-build/nuitka-report.xml
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nspire-converter-${{ matrix.platform }}
          path: ${{ runner.temp }}/converter-delivery/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
