name: Source-only recovery snapshot

on:
  workflow_dispatch:
  push:
    branches: ['work/ui20-integration']
    paths: ['.github/workflows/source-snapshot.yml']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Archive only the committed public source
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/source-snapshot"
          mkdir -p "$destination"
          # git archive excludes untracked builds, private resources and .git credentials.
          git archive --format=tar HEAD | gzip -n > "$destination/source.tar.gz"
          git ls-tree -r HEAD > "$destination/git-tree.txt"
          git rev-parse HEAD > "$destination/COMMIT"
          git rev-parse HEAD^{tree} > "$destination/TREE"
          (cd "$destination" && sha256sum source.tar.gz git-tree.txt COMMIT TREE > SHA256SUMS)
      - name: Upload source recovery artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-${{ github.sha }}
          path: ${{ runner.temp }}/source-snapshot/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
