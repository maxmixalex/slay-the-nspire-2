[project]
name = "nspire-converter"
version = "0.1.0"
description = "Compile an owned Slay the Spire 2 installation into nSpire calculator resources"
requires-python = ">=3.11,<3.13"
dependencies = [
  "Pillow==12.3.0", "numpy==2.3.5", "lz4==4.4.5", "fonttools==4.61.1",
  "zstandard==0.25.0", "regex==2026.9.29", "unicorn==2.1.4"
]

[dependency-groups]
dev = ["ruff>=0.17,<0.18", "mypy>=2.4,<2.5", "poethepoet>=0.48,<0.49"]
build = ["nuitka[onefile]>=4.3,<4.4", "zopfli==0.4.3", "patchelf>=0.17; sys_platform == 'linux'"]

[project.scripts]
nspire-converter = "nspire_converter.__main__:main"

[build-system]
requires = ["poetry-core>=2,<3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "nspire_converter", from = "python/src"}]
include = [{path = "python/src/nspire_converter/data", format = ["sdist", "wheel"]}]

[tool.poe.tasks]
lint = "ruff check python"
format-check = "ruff format --check python"
type-check = "mypy"
test = "python python/tools/test_python.py"
check.sequence = ["lint", "format-check", "type-check", "test"]
converter = "python -X utf8 python/tools/build_converter_bundle.py"
ndless = "python python/tools/build_ndless.py"
web = "python python/tools/build_web.py"
package = "python python/tools/package_release.py"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"python/tools/*.py" = ["E402"]
"python/tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["python/src/nspire_converter/source_version.py", "python/src/nspire_converter/paths.py", "python/src/nspire_converter/inventory.py", "python/tools/build_converter_bundle.py", "python/tools/package_release.py", "python/src/nspire_converter/converter.py", "python/src/nspire_converter/converter_threads.py", "python/src/nspire_converter/converter_workspace.py", "python/src/nspire_converter/converter_storage.py", "python/src/nspire_converter/converter_finalize.py", "python/src/nspire_converter/__main__.py"]
mypy_path = "python/src"
strict = true
follow_imports = "silent"
ignore_missing_imports = true
show_error_codes = true

# Raster recipes process dynamic binary catalogs; typed build, version and
# publication boundaries are checked strictly, and all recipes run in tests.
[[tool.mypy.overrides]]
module = ["nspire_converter.reference_inventory", "nspire_converter.split_content", "nspire_converter.storage_parts", "nspire_converter.converter_arm_validation", "nspire_converter.locale_profile", "nspire_converter.character_unlock_assets", "nspire_converter.coalesce_tile_resources"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["nspire_converter.converter", "nspire_converter.converter_threads", "nspire_converter.converter_workspace", "nspire_converter.converter_storage", "nspire_converter.converter_finalize", "nspire_converter.__main__"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
check_untyped_defs = true
warn_return_any = false
