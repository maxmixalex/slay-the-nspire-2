 function position(e){const r=canvas.getBoundingClientRect();return {x:Math.floor((e.clientX-r.left)*320/r.width),y:Math.floor((e.clientY-r.top)*240/r.height),inside:e.clientX>=r.left&&e.clientX<r.right&&e.clientY>=r.top&&e.clientY<r.bottom};}
 canvas.addEventListener('pointermove',e=>{const p=position(e);input(()=>game.pointer_move(p.x,p.y),false);});
 canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.focus();if(e.button<0||e.button>2)return;const p=position(e);canvas.setPointerCapture(e.pointerId);input(()=>{game.pointer_move(p.x,p.y);if(e.button===0)game.pointer_button(1);else game.pointer_aux_button(e.button===2?2:3,1);});});
 canvas.addEventListener('pointerup',e=>{if(e.button<0||e.button>2)return;const p=position(e);input(()=>{if(p.inside){game.pointer_move(p.x,p.y);if(e.button===0)game.pointer_button(0);else game.pointer_aux_button(e.button===2?2:3,0);}else game.pointer_cancel();});if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);});
 canvas.addEventListener('pointercancel',()=>input(()=>game.pointer_cancel()));
 canvas.addEventListener('contextmenu',e=>e.preventDefault());
 canvas.addEventListener('wheel',e=>{e.preventDefault();input(()=>game.pointer_scroll(Math.sign(e.deltaY)));},{passive:false});
 window.addEventListener('blur',()=>{if(commandButtons)commandButtons.cancel();physicalDown.clear();if(game.physical_keys_cancel)game.physical_keys_cancel();game.pointer_cancel();});
 function finishProfile(reason){profiling=false;measureButton.disabled=false;profile.resource_total={read_calls:ioCalls,read_bytes:ioBytes,copy_ms:ioTime};profile.finished_reason=reason;profile.finished_at=new Date().toISOString();reportView.textContent=JSON.stringify(profile,null,2);}
 measureButton.addEventListener('click',()=>{profile=freshProfile();ioCalls=ioBytes=ioTime=0;profiling=true;profileUntil=clock()+10000;lastPresented=0;lastScene=-1;measureButton.disabled=true;reportView.textContent=t('measuring');canvas.focus();});
 let previous=clock(),nextPaint=previous+1000/30;
 function loop(now){const elapsed=now-previous;previous=now;if(!document.hidden&&!game.closed()&&!changingLanguage){
  const active=profiling,t=active?clock():0,index=active?scene():0,calls=ioCalls,bytes=ioBytes,time=ioTime;game.advance(Math.max(0,Math.min(250,Math.round(elapsed))));flushProgress();serviceProfiles();if(active){add(profile.scenes[index].update,clock()-t);recordIo(profile.scenes[index],calls,bytes,time);}
  // Inputs mark the next presentation dirty. Never render again synchronously
  // in every pointer/key callback and then duplicate it in the same RAF.
  if(dirty||now>=nextPaint){draw();if(now>=nextPaint){nextPaint+=1000/30;if(nextPaint<now-1000/30)nextPaint=now+1000/30;}}
 }if(profiling&&(clock()>=profileUntil||game.closed()))finishProfile(game.closed()?'game_closed':'complete');requestAnimationFrame(loop);}
 document.addEventListener('visibilitychange',()=>{previous=clock();nextPaint=previous;if(commandButtons)commandButtons.cancel();physicalDown.clear();if(game.physical_keys_cancel)game.physical_keys_cancel();game.pointer_cancel();if(profiling&&document.hidden)finishProfile('tab_hidden');});
 draw();loading.hidden=true;measureButton.disabled=false;requestAnimationFrame(loop);canvas.focus();

})().catch(e=>{document.getElementById('error').textContent=t('startup_failed')+'\n'+e.message;console.error(e);});
</script></html>
